[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-ml-toolkit"
version = "2022.2"
description = "Bibliotecas próprias de análise de dados e machine learning para dados tabulares (2020-2022)"
readme = "README.md"
authors = [{ name = "Alexandre Béo da Cruz" }]
requires-python = ">=3.8,<3.12"
# Faixas compatíveis com o código de 2021-2022: o numpy 1.24 removeu np.str, o scikit-learn 1.4
# removeu OneHotEncoder(sparse=...) (obsoleto desde o 1.2) e o pandas 2 não foi testado.
# As versões testadas em 2026 estão em requirements.txt.
dependencies = [
    "numpy>=1.21,<1.24",
    "pandas>=1.3,<2",
    "scipy>=1.7,<1.11",
    "numba>=0.55,<0.58",
    "scikit-learn>=1.0,<1.2",
    "matplotlib>=3.5,<3.8",
    "seaborn>=0.11,<0.13",
    "ipython>=7,<8.13",
    "jinja2>=3",
]

[project.optional-dependencies]
exemplos = ["notebook", "xlrd>=2", "catboost>=1.0,<1.3", "ipywidgets>=7"]

[project.urls]
"Código" = "https://github.com/alexandrebcruz/tabular-ml-toolkit"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
    "AleCFunctions",
    "AleCFunctionsLearners",
    "AleDatasetAnalysis",
    "AleExplainers",
    "AleLearners",
    "AleMLAnalysis",
    "AleMetrics",
    "AleTransforms",
]
